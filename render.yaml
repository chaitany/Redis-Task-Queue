# Render Blueprint: dashboard + API + embedded worker, backed by Render Key Value.
services:
  - type: web
    name: dtask-demo
    runtime: python
    plan: free
    buildCommand: uv sync --frozen
    startCommand: uv run --frozen uvicorn web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dtask-redis
          property: connectionString

  - type: keyvalue
    name: dtask-redis
    plan: free
    maxmemoryPolicy: noeviction   # a queue must never silently drop keys
    ipAllowList: []               # internal network only
